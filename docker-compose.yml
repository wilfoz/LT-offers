services:
  postgres:
    image: postgres:16
    container_name: lt-offers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lt_offers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lt_offers_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lt_offers}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lt-offers-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-lt_offers}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lt-offers-pgdata:
